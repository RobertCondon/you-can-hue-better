services:
  hue:
    build: .
    image: you-can-hue-better
    container_name: you-can-hue-better
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_MAX_THREADS: "5"
      RAILS_FORCE_SSL: "${RAILS_FORCE_SSL:-0}"
    ports:
      - "3344:3000"
    volumes:
      - hue_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  hue_storage:
