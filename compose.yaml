# Run on clanker alongside whatever else is there. Copy .env.example to .env and fill it in, then
# `docker compose up -d --build`. The app answers on port 3344; put it behind the reverse proxy
# or change the host port. The container must be able to reach the bridge on the LAN, which the
# default bridge network allows.
services:
  hue:
    build: .
    image: you-can-hue-better
    container_name: you-can-hue-better
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_MAX_THREADS: "5"
      # Plain HTTP on the LAN unless a proxy terminates TLS; then set RAILS_FORCE_SSL=1.
      RAILS_FORCE_SSL: "${RAILS_FORCE_SSL:-0}"
    ports:
      - "3344:3000"
    volumes:
      # The SQLite databases (mirror, extensions, cable) and logs persist here.
      - hue_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  hue_storage:
